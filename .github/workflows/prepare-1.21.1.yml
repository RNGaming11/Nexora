name: Prepare Minecraft 1.21.1 port data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prepare-1.21.1.yml"
      - "tools/prepare_1_21_1.py"
      - "tools/version_port.py"
      - "tools/generate_recipe_serializer_inventory.py"
      - "tools/generate_data_component_inventory.py"
      - "tools/generate_builtin_registry_inventory.py"
      - "tools/generate_1_21_1_block_facts.py"
      - "tools/generate_1_21_1_model_states.py"
      - "tools/build_1_21_1_runtime_resources.py"
      - "ports/1.21.1/recipe-serializers.json"
      - "ports/1.21.1/data-component-ids.json"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      HORIZON_VERSIONS: ${{ github.workspace }}/.port-cache/versions
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare official 1.21.1 artifacts and mapped inventories
        run: python tools/prepare_1_21_1.py --jobs 4
      - name: Generate an independent packet inventory
        shell: pwsh
        run: |
          $report = Join-Path $env:HORIZON_VERSIONS "1.21.1\datagen\reports\packets.json"
          if (-not (Test-Path $report)) { throw "The official data generator did not produce packets.json." }
          New-Item -ItemType Directory -Force -Path "target\1.21.1" | Out-Null
          python tools/generate_packet_ids.py --report $report --out "target\1.21.1\packet_ids.rs" --protocol-version 767 --version-name 1.21.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $registries = Join-Path $env:HORIZON_VERSIONS "1.21.1\datagen\reports\registries.json"
          python tools/generate_recipe_serializer_inventory.py --report $registries --out "target\1.21.1\recipe-serializers.json" --version 1.21.1 --data-version 3955
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $generatedHash = (Get-FileHash "target\1.21.1\recipe-serializers.json" -Algorithm SHA256).Hash
          $pinnedHash = (Get-FileHash "ports\1.21.1\recipe-serializers.json" -Algorithm SHA256).Hash
          if ($generatedHash -ne $pinnedHash) { throw "Generated recipe serializer IDs differ from the pinned 1.21.1 registry inventory." }
          python tools/generate_data_component_inventory.py --report $registries --out "target\1.21.1\data-component-ids.json" --version 1.21.1 --data-version 3955
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $generatedHash = (Get-FileHash "target\1.21.1\data-component-ids.json" -Algorithm SHA256).Hash
          $pinnedHash = (Get-FileHash "ports\1.21.1\data-component-ids.json" -Algorithm SHA256).Hash
          if ($generatedHash -ne $pinnedHash) { throw "Generated data component IDs differ from the pinned 1.21.1 registry inventory." }
          python tools/generate_builtin_registry_inventory.py --report $registries --out "target/1.21.1/builtin-registry-ids.json" --version 1.21.1 --data-version 3955
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $blocks = Join-Path $env:HORIZON_VERSIONS '1.21.1/datagen/reports/blocks.json'
          python tools/generate_1_21_1_block_facts.py --report $blocks --out 'target/1.21.1/block-facts.json' --data-version 3955
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/generate_1_21_1_model_states.py --report $blocks --out 'target/1.21.1/model-states.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = Join-Path $env:HORIZON_VERSIONS '1.21.1/runtime-resources'
          foreach ($pair in @(
            @('target/1.21.1/builtin-registry-ids.json', (Join-Path $runtime 'builtin-registry-ids.json')),
            @('target/1.21.1/block-facts.json', (Join-Path $runtime 'facts.json')),
            @('target/1.21.1/model-states.json', (Join-Path $runtime 'model-states.json'))
          )) {
            $left = (Get-FileHash $pair[0] -Algorithm SHA256).Hash
            $right = (Get-FileHash $pair[1] -Algorithm SHA256).Hash
            if ($left -ne $right) { throw "Runtime file differs from independent output: $($pair[0])" }
          }
          cargo run -p horizon-client-render --example validate_1_21_1_resources --features minecraft-1-21-1 -- $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Prepare the active 26.3 baseline
        id: baseline
        continue-on-error: true
        run: python tools/version_port.py prepare 26.3 --download --jobs 4
      - name: Generate the 26.3 to 1.21.1 class diff and ranked worklist
        id: comparison
        if: steps.baseline.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/version_port.py diff 26.3 1.21.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/version_port.py report 26.3 1.21.1 --lines 100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload 26.3 comparison and ranked worklist
        if: ${{ steps.baseline.outcome == 'success' && steps.comparison.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexora-26.3-to-1.21.1-port-diff
          if-no-files-found: error
          compression-level: 6
          path: |
            .port-cache/versions/26.3/facts.json
            .port-cache/versions/26.3/prepared.json
            .port-cache/versions/26.3/classes.json
            .port-cache/versions/diff-26.3-1.21.1/diff.json
            .port-cache/versions/diff-26.3-1.21.1/vanilla_map.json
            .port-cache/versions/diff-26.3-1.21.1/report.json
            .port-cache/versions/diff-26.3-1.21.1/report.md
      - name: Upload prepared port data
        uses: actions/upload-artifact@v4
        with:
          name: nexora-minecraft-1.21.1-port-data
          if-no-files-found: error
          compression-level: 6
          path: |
            .port-cache/versions/1.21.1/facts.json
            .port-cache/versions/1.21.1/prepared.json
            .port-cache/versions/1.21.1/classes-client-server-diff.json
            .port-cache/versions/1.21.1/classes-mapped.json
            .port-cache/versions/1.21.1/classes-client-mapped.json
            .port-cache/versions/1.21.1/classes-server-mapped.json
            .port-cache/versions/1.21.1/datagen/reports/registries.json
            .port-cache/versions/1.21.1/datagen/reports/packets.json
            .port-cache/versions/1.21.1/datagen/reports/items.json
            .port-cache/versions/1.21.1/datagen/reports/blocks.json
            .port-cache/versions/1.21.1/datagen/reports/commands.json
            target/1.21.1/packet_ids.rs
            target/1.21.1/recipe-serializers.json
            target/1.21.1/data-component-ids.json
            target/1.21.1/builtin-registry-ids.json
            target/1.21.1/block-facts.json
            target/1.21.1/model-states.json

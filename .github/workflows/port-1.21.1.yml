name: 1.21.1 port baseline

on:
  push:
    branches:
      - nexora/master
    paths:
      - "crates/**"
      - "ports/1.21.1/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/port-1.21.1.yml"
  pull_request:
    branches:
      - nexora/master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: python -m unittest tools.test_proguard tools.test_packet_codec_coverage tools.test_version_port tools.test_builtin_registry_inventory tools.test_1_21_1_block_facts tools.test_1_21_1_model_states tools.test_1_21_1_runtime_resources tools.test_1_21_1_heightmap_predicates
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Core version tests
        run: cargo test -p horizon-core
      - name: Protocol tests
        run: cargo test -p horizon-protocol
      - name: Minecraft 1.21.1 protocol profile tests
        run: cargo test -p horizon-protocol --features minecraft-1-21-1
      - name: World registry tests
        run: cargo test -p horizon-world
      - name: Workspace compile check
        run: cargo check --workspace
      - name: Minecraft 1.21.1 client profile compile check
        run: cargo check -p horizon-client --features minecraft-1-21-1
      - name: Minecraft 1.21.1 legacy resource compatibility tests
        shell: pwsh
        run: |
          cargo test -p horizon-client-render --features minecraft-1-21-1 --lib legacy_target_without_day_timeline_uses_vanilla_cycle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p horizon-client-render --features minecraft-1-21-1 --lib target_without_dry_foliage_colormap_reuses_foliage_map
      - name: Separately named 1.21.1 executable compile check
        run: cargo check -p horizon-client --bin horizon-client-1-21-1 --features minecraft-1-21-1
      - name: Packet codec coverage audit
        shell: pwsh
        run: |
          if (Test-Path "ports/1.21.1/packet_ids.rs") {
            python tools/audit_packet_codec_coverage.py
          } else {
            Write-Host "Target packet_ids.rs is not committed yet; coverage audit is skipped."
          }

name: game build
# Builds packages on GitHub-hosted runners. Pinned Mojang files are downloaded to an ephemeral Linux exporter job
# and SHA-1 checked against research-lock.json; only Nexora exporter classes and prepared resources are passed to
# the platform builds. No maintainer-owned Mac or self-hosted runner is required.
# Called by release.yml and nightly-build.yml. It holds no secrets: signing the checksums is the caller's job.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true
      version:
        description: The version built in (HORIZON_VERSION), e.g. 0.2.81 or nightly-2026-10-28
        type: string
        required: true
      nightly:
        description: A nightly's "<date> <short sha>" (HORIZON_NIGHTLY), shown by the game; empty for a release
        type: string
        default: ''
      trusted:
        # Only release.yml says true: it builds main. A nightly can hold pull requests nobody reviewed yet, whose
        # build scripts and tests run here and could rewrite target/, the cargo home or a compiler cache. So an
        # untrusted build never runs on the release runner, never saves the Rust cache (its key is its own anyway),
        # and a trusted one never reads the machine's shared sccache, which pull requests' jobs write
        # (tests/test_nightly.py pins all of it).
        description: The source is main (a release); false for anything else (a nightly)
        type: boolean
        default: false
      developer_id:
        description: Sign the macOS programs with Developer ID and notarize the zip (the runner's keychain)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  exporters:
    # Clean hosted Linux machine; download only the pinned Mojang inputs required by the preparer.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      HORIZON_VERSION: ${{ inputs.version }}
      HORIZON_NIGHTLY: ${{ inputs.nightly }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux graphics and audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libvulkan1 mesa-vulkan-drivers xvfb
      - name: Download pinned Mojang inputs
        run: python3 tools/ci/download_pinned_minecraft.py
      - name: Prepare resources and compile original exporters
        id: prepared
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p horizon-prepare
          minecraft="$RUNNER_TEMP/nexora-minecraft"
          target/release/horizon-prepare --prepare --minecraft-dir "$minecraft" \
            --server-jar "$minecraft/server.jar" --root "$PWD"
          python3 tools/prepare_output.py check
          bundle=$(target/release/horizon-prepare compile-exporters --root "$PWD" | tail -1)
          mkdir -p exporters
          cp -R "$bundle/server" "$bundle/client" "$bundle/manifest.json" exporters/
          stray=$(find exporters -type f ! -path exporters/manifest.json \
            ! \( -name '*.class' \( -path 'exporters/server/dev/horizonlab/parity/*' -o -path 'exporters/client/dev/horizonlab/parity/*' \) \))
          [ -z "$stray" ] || { echo "::error::not one of our classes: $stray"; exit 1; }
          python3 tools/check_prepare_exporters.py --binary target/release/horizon-prepare
          version=$(python3 -c 'import json; print(json.load(open("research-lock.json"))["minecraft"]["version"])')
          cargo build --release --locked -p horizon-client --bin horizon-client
          home="$RUNNER_TEMP/horizon-smoke"
          rm -rf "$home" && mkdir -p "$home"
          driver=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$driver" || { echo "::error::Mesa lavapipe Vulkan driver is missing"; exit 1; }
          (cd "$home" && xvfb-run -a env VK_DRIVER_FILES="$driver" HORIZON_HOME="$home" HORIZON_NO_AUDIO=1 \
            "$PWD/target/release/horizon-client" --resources "$PWD/.local/horizon-client/$version" \
            --offscreen --world smoke --seed 1 --render-distance 4 --world-frames 1500 \
            --timeout-seconds 600 --smoke-report "$home/smoke.json" > "$home/client.log" 2>&1) \
            || { tail -60 "$home/client.log"; exit 1; }
          python3 - "$home/smoke.json" <<'EOF'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print(json.dumps(report))
          if report.get("error") is not None or report.get("frames", 0) < 1500 or not report.get("chunks") \
                  or not report.get("meshed_sections") or not report.get("player"):
              sys.exit("the smoke run did not draw a world")
          EOF
          cp "$home/smoke.json" "$RUNNER_TEMP/smoke-test.json"
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-test.json
          path: ${{ runner.temp }}/smoke-test.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: original-exporters
          path: exporters/
          if-no-files-found: error
          retention-days: 3

  build:
    needs: exporters
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            dir: horizon-linux-x86_64
            asset: horizon-linux-x86_64.tar.gz
            # The server build too: packaging/server/install.sh installs it on Linux.
            server_dir: horizon-server-linux-x86_64
            server_asset: horizon-server-linux-x86_64.tar.gz
          - name: windows
            os: windows-latest
            dir: horizon-windows-x64
            asset: horizon-windows-x64.zip
            exe: .exe
            # The C runtime linked in, so the game runs without the Visual C++ redistributable.
            rustflags: -C target-feature=+crt-static
          - name: macos
            mac: true
            os: macos-latest
            dir: horizon-macos-arm64
            asset: horizon-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # The release's version, built in (horizon_core::release): --version, user agents, crash reports and
      # telemetry say it. No version-bump commits.
      HORIZON_VERSION: ${{ inputs.version }}
      # A nightly's date and commit ("2026-10-28 0c02067"), which the game shows; empty for a release.
      HORIZON_NIGHTLY: ${{ inputs.nightly }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # Always from a clean checkout; target/ and .local/ are created by this job only.
          clean: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          # A release restores only what a release saved: an untrusted build has its own key and saves nothing.
          shared-key: ${{ inputs.trusted && 'release' || 'nightly' }}-${{ matrix.name }}
          save-if: ${{ inputs.trusted }}
      - name: ALSA and udev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Build the 26.3 client, horizon-ctl, horizon-prepare and horizon-server
        run: cargo build --release --locked -p horizon-client --bin horizon-client --bin horizon-ctl -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server
      - name: Build the Minecraft 1.21.1 client
        run: cargo build --release --locked -p horizon-client --features minecraft-1-21-1 --bin horizon-client-1-21-1
      - name: Every program the release folder takes was built
        run: |
          for binary in horizon-client horizon-client-1-21-1 horizon-ctl horizon-prepare horizon-server; do
            test -f "target/release/$binary${{ matrix.exe }}" || { echo "::error::target/release/$binary${{ matrix.exe }} is missing"; exit 1; }
          done
      - name: The signing keychain, unlocked
        if: runner.environment == 'self-hosted' && runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: packaging/macos/keychain.sh unlock
      - name: Signed with Developer ID and the hardened runtime
        # Before the checks below, so they run the programs as players will.
        if: runner.environment == 'self-hosted' && runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            codesign --force --options runtime --timestamp --keychain "$MACOS_SIGN_KEYCHAIN" \
              --identifier "dev.horizon.${binary#horizon-}" --sign "$MACOS_SIGN_IDENTITY" "target/release/$binary"
            codesign --verify --strict --verbose=2 "target/release/$binary"
          done
      - name: Only system libraries
        # Windows: no non-system DLL (a "DLL not found" dialog on some players' machines). Linux: the standard
        # loader and libraries every desktop distribution has. macOS: only the system's own libraries.
        run: |
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            file="target/release/$binary${{ matrix.exe }}"
            if [[ "$RUNNER_OS" == macOS ]]; then
              others=$(otool -L "$file" | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/Library/)' || true)
              [[ -z "$others" ]] || { echo "::error::$binary links $others"; exit 1; }
            else
              ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/check_imports.py "$file"
            fi
          done
      - name: Every program starts
        run: |
          set -euo pipefail
          bin=target/release
          "$bin/horizon-client${{ matrix.exe }}" --help | grep -q -- '--resources'
          "$bin/horizon-client-1-21-1${{ matrix.exe }}" --help | grep -q -- '--resources'
          "$bin/horizon-ctl${{ matrix.exe }}" --help > /dev/null
          "$bin/horizon-prepare${{ matrix.exe }}" --help | grep -q -- '--minecraft-dir'
          # The version is the release's.
          for binary in horizon-prepare horizon-server; do
            out=$("$bin/$binary${{ matrix.exe }}" --version | tr -d '\r')
            echo "$out"
            [[ "$out" == "$binary $HORIZON_VERSION" ]] || { echo "::error::expected $binary $HORIZON_VERSION"; exit 1; }
          done
      - uses: actions/download-artifact@v4
        with:
          name: original-exporters
          path: exporters
      - name: Package
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- package "target/release/horizon-client${{ matrix.exe }}" "dist/${{ matrix.dir }}"
          cp "target/release/horizon-client-1-21-1${{ matrix.exe }}" "dist/${{ matrix.dir }}/"
          cd dist
          rm -f "${{ matrix.asset }}"
          case "${{ matrix.asset }}" in
            *.tar.gz) tar czf "${{ matrix.asset }}" "${{ matrix.dir }}" ;;
            *) if [[ "$RUNNER_OS" == Windows ]]; then 7z a -tzip "${{ matrix.asset }}" "${{ matrix.dir }}" > /dev/null
               else
                 # Without resource forks and extended attributes: plain ditto adds an
                 # AppleDouble `._` file beside every file that has any.
                 ditto -c -k --norsrc --noextattr --noqtn --keepParent "${{ matrix.dir }}" "${{ matrix.asset }}"
                 if unzip -Z1 "${{ matrix.asset }}" | grep -E '(^|/)(\._|__MACOSX/)'; then
                   echo "::error::macOS metadata files in ${{ matrix.asset }}"; exit 1
                 fi
               fi ;;
          esac
          ls -l "${{ matrix.asset }}"
      - name: Notarized
        # A zip of programs can't be stapled: Gatekeeper asks Apple the first time each one runs.
        if: runner.environment == 'self-hosted' && runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        run: |
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            codesign --verify --strict "dist/${{ matrix.dir }}/$binary"
          done
          packaging/macos/notarize.sh "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3
      - name: The server build (the game without sound or controllers, as horizon-engine)
        if: matrix.server_asset
        run: |
          set -euo pipefail
          # After the client is packaged: target/release/horizon-client is rebuilt without the audio and
          # controllers features, so it needs neither libasound nor libudev (minimal server images lack them).
          cargo build --release --locked -p horizon-client --no-default-features --bin horizon-client
          cargo run --locked -p xtask -- package-server target/release/horizon-client "dist/${{ matrix.server_dir }}"
          folder="dist/${{ matrix.server_dir }}"
          python3 tools/check_imports.py --server "$folder/horizon-engine" "$folder/horizon-server" "$folder/horizon-prepare"
          "$folder/horizon-engine" --help | grep -q -- '--resources'
          [[ "$("$folder/horizon-server" --version)" == "horizon-server $HORIZON_VERSION" ]]
          cd dist
          rm -f "${{ matrix.server_asset }}"
          tar czf "${{ matrix.server_asset }}" "${{ matrix.server_dir }}"
          ls -l "${{ matrix.server_asset }}"
      - uses: actions/upload-artifact@v4
        if: matrix.server_asset
        with:
          name: ${{ matrix.server_asset }}
          path: dist/${{ matrix.server_asset }}
          if-no-files-found: error
          retention-days: 3
      - name: The signing keychain, locked again
        if: always() && runner.environment == 'self-hosted' && runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        run: packaging/macos/keychain.sh lock

